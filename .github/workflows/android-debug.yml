name: BlastNexa APK and signed AAB
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_aab:
        description: 'Build signed production AAB using existing BN_* secrets'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BN_BANNER_AD_UNIT: ${{ vars.BN_BANNER_AD_UNIT }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Prepare and validate complete game
        run: |
          python3 tools/prepare_assets.py
          python3 tools/verify_release_inputs.py
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Build test APK and unsigned production bundle
        run: ./gradlew --no-daemon --max-workers=2 :app:assemblePreviewDebug :app:bundleProductionRelease
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BlastNexa-v23-TEST-debug-apk
          path: app/build/outputs/apk/preview/debug/app-preview-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BlastNexa-v23-UNSIGNED-aab
          path: app/build/outputs/bundle/productionRelease/app-production-release.aab
          if-no-files-found: error
      - name: Prepare explicitly requested signing
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_aab }}
        env:
          KEYSTORE_B64: ${{ secrets.BN_KEYSTORE_B64 }}
          BN_STORE_PASSWORD: ${{ secrets.BN_STORE_PASSWORD }}
          BN_KEY_ALIAS: ${{ secrets.BN_KEY_ALIAS }}
          BN_KEY_PASSWORD: ${{ secrets.BN_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$BN_STORE_PASSWORD" && test -n "$BN_KEY_ALIAS" && test -n "$BN_KEY_PASSWORD" || { echo 'Missing private signing secrets'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/blastnexa-upload.jks"
          test -s "$RUNNER_TEMP/blastnexa-upload.jks"
      - name: Build signed production AAB
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_aab }}
        env:
          BN_KEYSTORE_PATH: ${{ runner.temp }}/blastnexa-upload.jks
          BN_STORE_PASSWORD: ${{ secrets.BN_STORE_PASSWORD }}
          BN_KEY_ALIAS: ${{ secrets.BN_KEY_ALIAS }}
          BN_KEY_PASSWORD: ${{ secrets.BN_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon --max-workers=2 :app:bundleProductionRelease
          jarsigner -verify app/build/outputs/bundle/productionRelease/app-production-release.aab > "$RUNNER_TEMP/aab-verify.txt"
          grep -q 'jar verified.' "$RUNNER_TEMP/aab-verify.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_aab }}
        with:
          name: BlastNexa-v23-SIGNED-aab
          path: app/build/outputs/bundle/productionRelease/app-production-release.aab
          if-no-files-found: error
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/blastnexa-upload.jks"
