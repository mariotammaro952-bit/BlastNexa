name: HTML game simulations (no APK)
on:
  push:
    branches: [codex/html-qa]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  html:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check all level solutions and audio
        run: |
          node tools/test_adventure.cjs
          node tools/test_ad_flow.cjs
          node tools/test_pulse_audio.cjs
          python tools/verify_release_inputs.py
      - name: Install browser
        run: |
          npm install --prefix "$RUNNER_TEMP/bn-browser" playwright@1.58.2
          node "$RUNNER_TEMP/bn-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Simulate game flow in browser
        run: |
          for BEGIN in 1 251 501 751 1001 1251 1501 1751; do
            END=$((BEGIN + 249))
            BN_QA_FROM="$BEGIN" BN_QA_TO="$END" NODE_PATH="$RUNNER_TEMP/bn-browser/node_modules" node tools/test_browser.cjs
          done
          python - <<'PYREPORT'
          import json,pathlib
          reports=[json.loads(p.read_text()) for p in pathlib.Path('qa-output').glob('simulations-*.json')]
          assert len(reports)==8
          result={k:sum(r[k] for r in reports) for k in reports[0] if isinstance(reports[0][k],int)}
          assert result['winningGames']==4000 and result['exhaustedMoves']==4000 and result['blockedBoards']==4000 and result['randomGames']==2000
          result['scenes']=['war','ocean']
          pathlib.Path('qa-output/simulations.json').write_text(json.dumps(result,indent=2))
          print(result)
          PYREPORT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BlastNexa-HTML-v4-QA
          path: qa-output
