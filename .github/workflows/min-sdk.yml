name: BlastNexa minimum Android compatibility QA
on:
  push:
    branches: [codex/min-sdk-qa-v27]
permissions:
  contents: read
jobs:
  android7:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Build the exact release game sources for instrumentation
        run: |
          python3 tools/prepare_assets.py
          ./gradlew --no-daemon --max-workers=2 assemblePreviewDebug assemblePreviewDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 24
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -memory 2048 -cores 2
          script: |
            mkdir -p minimum-sdk-evidence
            adb install -r app/build/outputs/apk/preview/debug/app-preview-debug.apk
            adb install -r app/build/outputs/apk/androidTest/preview/debug/app-preview-debug-androidTest.apk
            adb logcat -c
            timeout 600 adb shell am instrument -w -r -e class com.blastnexa.blockpuzzle.MinSdkValidationTest com.blastnexa.blockpuzzle.preview.test/androidx.test.runner.AndroidJUnitRunner | tee minimum-sdk-evidence/instrumentation.txt
            adb logcat -d > minimum-sdk-evidence/logcat.txt
            adb pull /sdcard/Android/data/com.blastnexa.blockpuzzle.preview/files/minimum-sdk minimum-sdk-evidence/ || true
            grep -Eq '^OK \(1 test\)' minimum-sdk-evidence/instrumentation.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v27-android7-minimum-sdk
          path: minimum-sdk-evidence/
          retention-days: 7
