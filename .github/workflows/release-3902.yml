name: BlastNexa 3902 release candidate
on:
  push:
    branches: [fix/blastnexa-production-banner-2253410546]
    paths: [.github/workflows/release-3902.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      BN_BANNER_AD_UNIT: ca-app-pub-7428534984744854/2253410546
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare and sanity-check BlastNexa 3902
        run: |
          set -euo pipefail
          python3 tools/prepare_assets.py
          python3 tools/verify_release_inputs.py
          node --check game/landscape-v24.js
          node --check game/rifle-v35.js
          node --check game/supernova-v30.js
          node qa/coin_shoot_v37.cjs
          grep -q 'versionCode = 3902' app/build.gradle.kts
          grep -q 'versionName = "1.0.0-v39.1"' app/build.gradle.kts
      - name: Build and lint production
        run: ./gradlew --no-daemon --max-workers=2 :app:bundleProductionRelease :app:lintProductionRelease
      - name: Create release report
        run: |
          mkdir -p release-report
          printf 'Application: com.blastnexa.blockpuzzle\nVersion code: 3902\nVersion name: 1.0.0-v39.1\nBanner: %s\nInterstitial: ca-app-pub-7428534984744854/2281488833\nRewarded: ca-app-pub-7428534984744854/7070781083\nSigned: not yet checked\n' "$BN_BANNER_AD_UNIT" > release-report/status.txt
      - name: Sign with existing upload key, if configured
        id: signing
        env:
          BN_KEYSTORE_B64: ${{ secrets.BN_KEYSTORE_B64 }}
          BN_STORE_PASSWORD: ${{ secrets.BN_STORE_PASSWORD }}
          BN_KEY_ALIAS: ${{ secrets.BN_KEY_ALIAS }}
          BN_KEY_PASSWORD: ${{ secrets.BN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$BN_KEYSTORE_B64" || -z "$BN_STORE_PASSWORD" || -z "$BN_KEY_ALIAS" || -z "$BN_KEY_PASSWORD" ]]; then
            echo "Missing one or more private signing secrets. No Play-ready artifact will be produced." | tee -a release-report/status.txt
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$BN_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/blastnexa-upload.jks"
          chmod 600 "$RUNNER_TEMP/blastnexa-upload.jks"
          export BN_KEYSTORE_PATH="$RUNNER_TEMP/blastnexa-upload.jks"
          ./gradlew --no-daemon --max-workers=2 :app:bundleProductionRelease
          set -o pipefail
          jarsigner -verify -verbose -certs app/build/outputs/bundle/productionRelease/app-production-release.aab | grep -q "jar verified."
          mkdir -p signed-release
          cp app/build/outputs/bundle/productionRelease/app-production-release.aab signed-release/BlastNexa-3902-signed.aab
          echo "Signed: YES (verified by jarsigner)" >> release-report/status.txt
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Validate signed bundle
        if: steps.signing.outputs.signed == 'true'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o "$RUNNER_TEMP/bundletool.jar"
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle=signed-release/BlastNexa-3902-signed.aab
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle=signed-release/BlastNexa-3902-signed.aab --module=base > release-report/manifest.xml
          grep -q 'versionCode="3902"' release-report/manifest.xml
          echo 'bundletool validation: PASS' >> release-report/status.txt
      - name: Upload signed AAB only when validated
        if: steps.signing.outputs.signed == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: BlastNexa-3902-SIGNED-PLAY-REVIEW
          path: signed-release/BlastNexa-3902-signed.aab
          if-no-files-found: error
          retention-days: 7
      - name: Publish QA status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BlastNexa-3902-release-report
          path: release-report/
          retention-days: 7
