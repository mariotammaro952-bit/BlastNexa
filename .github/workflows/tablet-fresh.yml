name: BlastNexa final tablet isolated persistence diagnostic
on:
  push:
    branches: [codex/tablet-fresh-process-v27]
permissions:
  contents: read
  actions: read
jobs:
  tablet:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [35,36]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: BlastNexa-v27-invites-build
          run-id: 40006019755
          github-token: ${{ github.token }}
          path: imported-build
      - name: Stage matching original final validation pair
        run: |
          mkdir imported-artifacts
          cp -a imported-build/app/build/outputs/apk/. imported-artifacts/
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-build: 14472402
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -memory 1536 -cores 2
          script: bash tools/run_tablet_fresh_validation.sh
      - name: Record emulator host failure evidence
        if: always()
        run: |
          mkdir -p tablet-fresh-evidence
          sudo dmesg --ctime > tablet-fresh-evidence/host-kernel.txt 2>&1 || true
          ls -l /sys/fs/cgroup > tablet-fresh-evidence/cgroup-files.txt
          rg --files --hidden --no-ignore -g 'core*' -g '*.dmp' -g '*.db' . /tmp /home/runner/.android > tablet-fresh-evidence/possible-emulator-dumps.txt 2>/dev/null || true
          df -h > tablet-fresh-evidence/disk.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v27_1-tablet-fresh-api-${{ matrix.api }}
          path: tablet-fresh-evidence/
          retention-days: 7
