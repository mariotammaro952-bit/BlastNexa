name: BlastNexa v27.1 tablet validation on current software renderer
on:
  push:
    branches: [codex/tablet-qa-v27]
permissions:
  contents: read
  actions: read
jobs:
  tablet:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      BN_QA_SIZE: 800x1280
      BN_QA_DENSITY: 160
      BN_QA_CUTOUT: 0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: BlastNexa-v27-invites-build
          run-id: 39998012371
          github-token: ${{ github.token }}
          path: imported-build
      - name: Stage unchanged release validation APKs
        run: |
          mkdir imported-artifacts
          cp -a imported-build/app/build/outputs/apk/. imported-artifacts/
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu software -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -memory 3072 -cores 2
          script: bash tools/run_android_validation.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v27_1-tablet-software-evidence
          path: android-evidence/
          retention-days: 7
