name: BlastNexa v28 layout and paired-reward checks
on:
  push:
    branches: [codex/landscape-slot-v24]
    paths:
      - game/landscape-v24.css
      - app/src/androidTest/**
      - .github/workflows/v28-layout-validation.yml
      - .github/workflows/v24-landscape.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: blastnexa-layout-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BN_BANNER_AD_UNIT: ${{ vars.BN_BANNER_AD_UNIT }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Verify assets and 10000 committed spins per slot
        run: |
          python3 tools/prepare_assets.py
          python3 tools/verify_release_inputs.py
          node --check game/landscape-v24.js
          node qa/v24_layout.cjs
          node qa/coins.cjs
          node qa/slot_economy_v28.cjs
      - name: Build installables and native UI checks
        run: |
          ./gradlew --no-daemon --max-workers=2 assemblePreviewDebug assemblePreviewDebugAndroidTest assemblePreviewRelease bundleProductionRelease
          mkdir -p signing-tools/lib signing-tools/lib64
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" signing-tools/lib/
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" signing-tools/
          cp -a "$ANDROID_HOME/build-tools/36.0.0/lib64/." signing-tools/lib64/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BlastNexa-v28-final-layout-build
          path: |
            app/build/outputs/apk/
            app/build/outputs/bundle/
            signing-tools/
            qa/coins_v28_result.json
            qa/slot_economy_v28_result.json
          retention-days: 7
          if-no-files-found: error
  android:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 31
            screen: compact
            size: 720x1280
            density: 320
            cutout: 0
            expected: 5
            methods: com.blastnexa.blockpuzzle.LaunchValidationTest#a0_homeBannerSharesTheSidebarAndCollapsesWithoutAnAd,com.blastnexa.blockpuzzle.LaunchValidationTest#g_landscapePuzzleSlotAndBanner,com.blastnexa.blockpuzzle.LaunchValidationTest#h_realTouchesRapidTapsAndFullAnimation,com.blastnexa.blockpuzzle.LaunchValidationTest#l_virtualCoinsUseRealTouchAndSurviveRecreation,com.blastnexa.blockpuzzle.LaunchValidationTest#p_coloredLineChoicesChargeTheDisplayedCoins
          - api: 36
            screen: compact
            size: 720x1280
            density: 320
            cutout: 0
            expected: 5
            methods: com.blastnexa.blockpuzzle.LaunchValidationTest#a0_homeBannerSharesTheSidebarAndCollapsesWithoutAnAd,com.blastnexa.blockpuzzle.LaunchValidationTest#g_landscapePuzzleSlotAndBanner,com.blastnexa.blockpuzzle.LaunchValidationTest#h_realTouchesRapidTapsAndFullAnimation,com.blastnexa.blockpuzzle.LaunchValidationTest#l_virtualCoinsUseRealTouchAndSurviveRecreation,com.blastnexa.blockpuzzle.LaunchValidationTest#p_coloredLineChoicesChargeTheDisplayedCoins
          - api: 36
            screen: wide-cutout
            size: 720x1600
            density: 320
            cutout: 1
            expected: 5
            methods: com.blastnexa.blockpuzzle.LaunchValidationTest#a0_homeBannerSharesTheSidebarAndCollapsesWithoutAnAd,com.blastnexa.blockpuzzle.LaunchValidationTest#g_landscapePuzzleSlotAndBanner,com.blastnexa.blockpuzzle.LaunchValidationTest#h_realTouchesRapidTapsAndFullAnimation,com.blastnexa.blockpuzzle.LaunchValidationTest#l_virtualCoinsUseRealTouchAndSurviveRecreation,com.blastnexa.blockpuzzle.LaunchValidationTest#p_coloredLineChoicesChargeTheDisplayedCoins
          - api: 36
            screen: tablet
            size: 800x1280
            density: 160
            cutout: 0
            expected: 3
            methods: com.blastnexa.blockpuzzle.LaunchValidationTest#a0_homeBannerSharesTheSidebarAndCollapsesWithoutAnAd,com.blastnexa.blockpuzzle.LaunchValidationTest#l_virtualCoinsUseRealTouchAndSurviveRecreation,com.blastnexa.blockpuzzle.LaunchValidationTest#p_coloredLineChoicesChargeTheDisplayedCoins
    env:
      BN_QA_SIZE: ${{ matrix.size }}
      BN_QA_DENSITY: ${{ matrix.density }}
      BN_QA_CUTOUT: ${{ matrix.cutout }}
      BN_QA_EXPECTED_TESTS: ${{ matrix.expected }}
      BN_QA_TEST_METHODS: ${{ matrix.methods }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: BlastNexa-v28-final-layout-build
          path: imported-build
      - name: Stage APKs and enable emulator acceleration
        run: |
          mkdir imported-artifacts
          cp -a imported-build/app/build/outputs/apk/. imported-artifacts/
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-build: 14472402
          disable-animations: false
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -memory 2048 -cores 2
          script: bash tools/run_android_validation.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v28-final-android-api-${{ matrix.api }}-${{ matrix.screen }}
          path: android-evidence/
          retention-days: 7
