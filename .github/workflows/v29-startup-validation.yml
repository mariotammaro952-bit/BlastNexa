name: BlastNexa v29 native startup confirmation
on:
  push:
    branches: [codex/landscape-slot-v24]
    paths:
      - .github/workflows/v29-startup-validation.yml
      - tools/run_android_validation_settled.sh
      - app/src/androidTest/**
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build-native-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: BlastNexa-v29-static-start-build
          run-id: 40129934883
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reference-build
      - name: Verify final game payload and compile updated native checks
        run: |
          python3 tools/prepare_assets.py
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          apk=Path('reference-build/app/build/outputs/apk/preview/debug/app-preview-debug.apk')
          with zipfile.ZipFile(apk) as package:
              for name in ('index.html','landscape-v24.css','landscape-v24.js','static-v29.css','static-v29.js'):
                  assert package.read('assets/'+name)==(Path('app/src/main/assets')/name).read_bytes(),name
          print('Final shipped game assets unchanged')
          PY
          ./gradlew --no-daemon --max-workers=2 assemblePreviewDebug assemblePreviewDebugAndroidTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BlastNexa-v29-updated-native-tests
          path: app/build/outputs/apk/
          retention-days: 7
  android:
    needs: build-native-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 31
            screen: compact
            size: 720x1280
            density: 320
            expected: 22
          - api: 36
            screen: compact
            size: 720x1280
            density: 320
            expected: 22
          - api: 36
            screen: tablet
            size: 800x1280
            density: 160
            expected: 6
            methods: com.blastnexa.blockpuzzle.LaunchValidationTest#a00_freshCampaignStartsOnceWithTwentyLivesAndOneThousandCoins,com.blastnexa.blockpuzzle.LaunchValidationTest#a01_centeredBoardAndStaticPagedScreensUsePhysicalTouches,com.blastnexa.blockpuzzle.LaunchValidationTest#a0_homeBannerSharesTheSidebarAndCollapsesWithoutAnAd,com.blastnexa.blockpuzzle.LaunchValidationTest#g_landscapePuzzleSlotAndBanner,com.blastnexa.blockpuzzle.LaunchValidationTest#l_virtualCoinsUseRealTouchAndSurviveRecreation,com.blastnexa.blockpuzzle.LaunchValidationTest#p_coloredLineChoicesChargeTheDisplayedCoins
    env:
      BN_QA_SIZE: ${{ matrix.size }}
      BN_QA_DENSITY: ${{ matrix.density }}
      BN_QA_CUTOUT: '0'
      BN_QA_EXPECTED_TESTS: ${{ matrix.expected }}
      BN_QA_TEST_METHODS: ${{ matrix.methods }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Download matching app and updated instrumentation APKs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: BlastNexa-v29-updated-native-tests
          path: imported-artifacts
      - name: Verify unchanged game payload and stage emulator APKs
        run: |
          python3 tools/prepare_assets.py
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          apk=Path('imported-artifacts/preview/debug/app-preview-debug.apk')
          with zipfile.ZipFile(apk) as package:
              for name in ('index.html','landscape-v24.css','landscape-v24.js','static-v29.css','static-v29.js'):
                  assert package.read('assets/'+name)==(Path('app/src/main/assets')/name).read_bytes(),name
          print('All five final v29 assets match the tested APK')
          PY
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-build: 14472402
          disable-animations: false
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -memory 2048 -cores 2
          script: bash tools/run_android_validation_settled.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v29-settled-api-${{ matrix.api }}-${{ matrix.screen }}
          path: android-evidence/
          retention-days: 7
