name: BlastNexa v32 reconnect Android 36
on:
  push:
    branches: [codex/v32-android36-reconnect]
    paths: [.github/workflows/v32-android36-reconnect.yml, tools/reconnect_android36.sh, tools/android36_direct.cjs, tools/watch_android_host.sh]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: blastnexa-v32-reconnect-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android36:
    name: Android 36 ${{ matrix.profile }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {profile: standard-4gb, size: 720x1280, cutout: 0, memory: 4096}
          - {profile: cutout-4gb, size: 720x1600, cutout: 1, memory: 4096}
          - {profile: cutout-2gb, size: 720x1600, cutout: 1, memory: 2048}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      BN_QA_SIZE: ${{ matrix.size }}
      BN_QA_DENSITY: 320
      BN_QA_CUTOUT: ${{ matrix.cutout }}
      BN_QA_ISOLATE_TESTS: 1
      BN_QA_EXPECTED_TESTS: 4
      BN_QA_DIRECT: 1
      BN_QA_BOOTSTRAP_ONLY: 1
      BN_QA_TEST_METHODS: com.blastnexa.blockpuzzle.LaunchValidationTest#t_v32RelaunchIsLargeRedAndUsesPhysicalTouches,com.blastnexa.blockpuzzle.LaunchValidationTest#u_v32CoinPagesStayOpenAndNeverDuplicateSavedRewards,com.blastnexa.blockpuzzle.LaunchValidationTest#v_v32MapPagerAndPuzzleAreCentredAndDoNotOverlapAds,com.blastnexa.blockpuzzle.LaunchValidationTest#s_bannerStaysInsideRequestedCentreDeck
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with: {node-version: '24'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: BlastNexa-v32-build
          run-id: 40222473092
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: imported-build
      - name: Stage the original v32 APKs and enable KVM
        run: |
          mkdir imported-artifacts
          cp -a imported-build/app/build/outputs/apk/. imported-artifacts/
          sha256sum imported-artifacts/preview/debug/app-preview-debug.apk imported-artifacts/androidTest/preview/debug/app-preview-debug-androidTest.apk
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Let sdkmanager install the current stable emulator. The former pin was
      # 36.3.10; use the supported software backend for this headless CI target.
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu software -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -memory ${{ matrix.memory }} -cores 2
          script: bash tools/reconnect_android36.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: BlastNexa-v32-reconnect-${{ matrix.profile }}-${{ github.run_attempt }}
          path: android-evidence/
          retention-days: 7
