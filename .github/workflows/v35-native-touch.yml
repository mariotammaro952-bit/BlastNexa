name: Verify v35 rifle using UI-tree preflight and the unchanged five-second clock
on:
  push:
    branches: [codex/native-touch-v35]
    paths: [app/src/androidTest/**, .github/workflows/v35-native-touch.yml]
permissions:
  contents: read
  actions: read
jobs:
  rifle:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      BN_QA_SIZE: 720x1280
      BN_QA_DENSITY: 320
      BN_QA_CUTOUT: 0
      BN_QA_ISOLATE_TESTS: 1
      BN_QA_EXPECTED_TESTS: 1
      BN_QA_TEST_METHODS: com.blastnexa.blockpuzzle.LaunchValidationTest#x_v35FiveSecondRifleBonus
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: BlastNexa-v35-build
          run-id: 40315770367
          github-token: ${{ github.token }}
          path: imported-build
      - name: Compile only the refined instrumentation, preserving the tested game APK
        run: |
          ./gradlew --no-daemon --max-workers=2 assemblePreviewDebugAndroidTest
          mkdir -p imported-artifacts/preview/debug imported-artifacts/androidTest/preview/debug
          cp imported-build/app/build/outputs/apk/preview/debug/app-preview-debug.apk imported-artifacts/preview/debug/
          cp app/build/outputs/apk/androidTest/preview/debug/app-preview-debug-androidTest.apk imported-artifacts/androidTest/preview/debug/
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu software -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -memory 4096 -cores 2
          script: bash tools/run_android_validation_settled.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: BlastNexta-v35-native-live-rifle
          path: android-evidence/
          retention-days: 7
